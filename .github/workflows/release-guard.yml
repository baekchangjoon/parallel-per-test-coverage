name: release-guard

# Validates every v* tag and release against the release.yml contract, so a manual
# `gh release create` or a mis-tagged release fails loudly instead of shipping silently
# (the v1.4.0 incident: tag on a pre-feature commit, release with 1 of 14 assets).
#
# What it checks (see .github/scripts/release-guard.sh):
#   - the tagged commit's source version (build.gradle.kts + maven-plugin/pom.xml,
#     including pjacoco.agent.version) equals the tag's version
#   - the release carries the full artifact set: agent + 4 testkit + maven-plugin jars,
#     a .sha256 per jar, no orphans, no stray assets
#
# Coverage note: events created with the workflow's own GITHUB_TOKEN do not trigger
# other workflows, so releases produced by release.yml do NOT fire these triggers —
# release.yml runs the same script itself as a final self-check step. These triggers
# are the net for MANUAL tags/releases (human credentials / PAT), which is exactly the
# case being guarded against.
#
# GitHub offers no way to BLOCK release creation, so this is a detective control -
# it turns a bad release into a red run + failure annotations. Re-run it after fixing a
# flagged release via workflow_dispatch with the tag.

on:
  push:
    tags: ["v*"]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-guard-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Untrusted-ish input (tag names) is passed via env and validated with a
      # whole-string [[ =~ ]] match (grep -E matches per line, which a multi-line
      # value could bypass) before it reaches GITHUB_OUTPUT / the checkout ref.
      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            release)           TAG="$RELEASE_TAG" ;;
            *)                 TAG="$REF_NAME" ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._+-][A-Za-z0-9._+-]*)?$ ]]; then
            # A pushed v* tag that is not a release tag (e.g. a marker like "vnext")
            # is not this guard's business; releases/dispatches must be well-formed.
            if [ "$EVENT" = "push" ]; then
              echo "::notice::Pushed tag '$TAG' is not a v<semver> release tag - skipping the release guard."
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::'$TAG' is not a v<semver> tag."
            exit 1
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Tag pushes may race release.yml's release creation; only release/dispatch
          # events hard-require the release object to exist.
          if [ "$EVENT" = "push" ]; then
            echo "require_release=0" >> "$GITHUB_OUTPUT"
          else
            echo "require_release=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tag.outputs.skip != '1'
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        if: steps.tag.outputs.skip != '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate source version + release assets
        if: steps.tag.outputs.skip != '1'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_RELEASE: ${{ steps.tag.outputs.require_release }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-guard.sh
