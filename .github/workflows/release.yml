name: release

# One-click release: builds the shaded agent jar, tags the commit, and publishes a
# GitHub Release with the jar + its SHA-256 checksum attached.
#
# How to run (web UI): repo → Actions → "release" → "Run workflow".
#   - version: leave blank to use the version from build.gradle.kts, or type e.g. 0.2.0 to override.
#   - prerelease: tick to mark the release as a pre-release.
# The tag created is "v<version>" on the selected branch (default: the branch you dispatch from).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (blank = read from build.gradle.kts). Tag will be v<version>."
        required: false
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the tag and the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # secrets are not readable in step `if:` expressions — surface presence as booleans here.
      HAS_CENTRAL_CREDS: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.SIGNING_KEY != '' }}
      HAS_PORTAL_CREDS: ${{ secrets.GRADLE_PUBLISH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Untrusted input (the dispatcher-typed version) is passed via env, never interpolated
      # into the shell, and validated against a strict pattern before any further use.
      - name: Resolve release version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            # Ask Gradle for the resolved project version (single source of truth in build.gradle.kts).
            VERSION=$(./gradlew -q --no-daemon properties | awk -F': ' '/^version: /{print $2}')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version (input empty and none found in build.gradle.kts)."
            exit 1
          fi
          # Whole-string [[ =~ ]] match (grep -E matches per line, which a multi-line
          # value could bypass). Semver-shaped so the release-guard workflow, which
          # requires v<semver> tags, can never flag a release this workflow produced.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._+-][A-Za-z0-9._+-]*)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected <major>.<minor>.<patch> with an optional [._+-]qualifier."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (tag v$VERSION)"

      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump the version in build.gradle.kts or pass a new version input."
            exit 1
          fi

      # P1-2 guard: the released version MUST equal the source default in build.gradle.kts, so that anyone
      # who clones this tag and builds (e.g. publishToMavenLocal from the tag commit) produces the SAME
      # version as the release artifacts. A workflow `version` input that differs from the committed source
      # default would tag a commit whose source still says the old version — a silent version skew.
      - name: Verify source version matches the release version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          SOURCE_VERSION="$(./gradlew -q --no-daemon properties | awk -F': ' '/^version: /{print $2}')"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::Release version '$VERSION' != build.gradle.kts source version '$SOURCE_VERSION'. Bump the source default (and the consumable refs per docs/RELEASING.md) to '$VERSION' and commit it on this ref before releasing, so a tag-clone build produces matching artifacts."
            exit 1
          fi
          echo "Source version matches release version: $VERSION"

      - name: Build + test the release artifacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Agent (shaded, tested) + testkit jars to the local Maven repo (named by artifactId).
          ./gradlew --no-daemon "-PreleaseVersion=$VERSION" \
            :agent:test :agent:shadowJar \
            :agent:publishToMavenLocal \
            :testkit-core:publishToMavenLocal :testkit-junit5:publishToMavenLocal \
            :testkit-junit4:publishToMavenLocal :testkit-restassured:publishToMavenLocal
          # Maven plugin jar (resolves io.github.beltian.pjacoco:pjacoco-agent:$VERSION from the mavenLocal step above).
          mvn -B -ntp -f maven-plugin/pom.xml -DskipTests "-Dpjacoco.agent.version=$VERSION" package

      - name: Stage versioned artifacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          # mavenLocal path follows the groupId (io.github.beltian.pjacoco since v2.0.0).
          M2="$HOME/.m2/repository/io/github/beltian/pjacoco"
          # Agent shaded jar (the build output is the same artifact published as io.github.beltian.pjacoco:pjacoco-agent).
          cp "agent/build/libs/pjacoco-agent.jar" "dist/pjacoco-agent-${VERSION}.jar"
          # Testkit jars from mavenLocal (artifactId-named).
          for a in pjacoco-testkit pjacoco-testkit-junit5 pjacoco-testkit-junit4 pjacoco-testkit-restassured; do
            cp "$M2/$a/${VERSION}/$a-${VERSION}.jar" "dist/$a-${VERSION}.jar"
          done
          # Maven plugin jar from the Maven build.
          cp "maven-plugin/target/pjacoco-maven-plugin-${VERSION}.jar" "dist/pjacoco-maven-plugin-${VERSION}.jar"
          # The deprecated jacocoagent-parallel alias (renamed in v1.3.0) was removed in v2.0.0 as
          # documented in docs/RELEASING.md ("remove after v1.4.x") — depend on the coordinate
          # io.github.beltian.pjacoco:pjacoco-agent, not a filename.
          # Checksums for every staged jar.
          ( cd dist && for j in *.jar; do sha256sum "$j" > "$j.sha256"; done )
          echo "Staged artifacts:"; ls -1 dist
          count="$(find dist -maxdepth 1 -name '*.jar' | wc -l | tr -d ' ')"
          test "$count" -eq 6 || { echo "::error::expected 6 jars (agent + 4 testkit + maven-plugin), staged $count."; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$TAG" \
            dist/*.jar dist/*.jar.sha256 \
            --target "$TARGET_SHA" \
            --title "v${VERSION}" \
            --generate-notes \
            $PRERELEASE_FLAG

      # Self-check: releases created with GITHUB_TOKEN do not fire the release-guard
      # workflow's triggers (GitHub suppresses workflow-to-workflow events), so run the
      # same guard script here against the release just published.
      - name: Release guard self-check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_RELEASE: "1"
        run: bash .github/scripts/release-guard.sh

      # ---- Public publishing (credentials-gated; each step is skipped until its secrets exist,
      # so the GitHub Release above never depends on external registries). Uploads use
      # USER_MANAGED/autoPublish=false: artifacts land in the Central Portal in "validated" state
      # and go live only after a manual Publish click — deliberate for the first releases.

      - name: Publish libraries to Maven Central (Portal bundle)
        if: ${{ env.HAS_CENTRAL_CREDS == 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # agent + 4 testkits only — the Gradle plugin ships via the Plugin Portal instead.
          ./gradlew --no-daemon "-PreleaseVersion=$VERSION" \
            :agent:publishAllPublicationsToCentralStagingRepository \
            :testkit-core:publishAllPublicationsToCentralStagingRepository \
            :testkit-junit5:publishAllPublicationsToCentralStagingRepository \
            :testkit-junit4:publishAllPublicationsToCentralStagingRepository \
            :testkit-restassured:publishAllPublicationsToCentralStagingRepository \
            centralBundle
          # Every artifact in the bundle must be signed — an unsigned bundle fails Portal validation.
          asc_missing="$(find build/staging-deploy -name '*.jar' ! -name '*.asc' | while read -r j; do
            [ -f "$j.asc" ] || echo "$j"
          done)"
          if [ -n "$asc_missing" ]; then
            echo "::error::unsigned artifacts in the bundle (SIGNING_KEY not applied?):"; echo "$asc_missing"; exit 1
          fi
          TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl -sSf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=pjacoco-$VERSION"
          echo "Central bundle uploaded (USER_MANAGED) — publish it from https://central.sonatype.com/publishing"

      - name: Publish maven-plugin to Maven Central
        if: ${{ env.HAS_CENTRAL_CREDS == 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
          # The agent 2.x is already in mavenLocal from the build step above.
          mvn -B -ntp -f maven-plugin/pom.xml -Pcentral -DskipTests \
            "-Dpjacoco.agent.version=$VERSION" "-Dgpg.passphrase=$SIGNING_PASSWORD" deploy

      - name: Publish Gradle plugin to the Plugin Portal
        if: ${{ env.HAS_PORTAL_CREDS == 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          # plugin-publish reads GRADLE_PUBLISH_KEY/GRADLE_PUBLISH_SECRET from the environment —
          # no -P flags, so the credentials never appear in the process list.
          ./gradlew --no-daemon "-PreleaseVersion=$VERSION" :gradle-plugin:publishPlugins

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "## Release"
            if [ -n "$TAG" ]; then
              echo ""
              echo "- Tag: \`$TAG\`"
              echo "- Assets (each + \`.sha256\`):"
              echo "  - \`pjacoco-agent-${VERSION}.jar\`"
              echo "  - \`pjacoco-testkit-${VERSION}.jar\`, \`pjacoco-testkit-junit5-${VERSION}.jar\`, \`pjacoco-testkit-junit4-${VERSION}.jar\`, \`pjacoco-testkit-restassured-${VERSION}.jar\`"
              echo "  - \`pjacoco-maven-plugin-${VERSION}.jar\`"
              echo "- Release: $RELEASE_URL"
            else
              echo ""
              echo "_Release failed before a version was resolved._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
